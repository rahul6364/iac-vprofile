name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terrform/**
  pull_request:
    branches:
      - main
    paths:
      - terrform/**

env:
  AWS_ACCESS_KEY_ID: ${{secret.AWS_ACCESSS_KEY_ID}}
  AWS_SECRET_ACCESSS_KEY: ${{secret.AWS_SECRET_ACCESSS_KEY_KEY}}
  BUCKET_TF_STATE: ${{secret.BUCKET_TF_STATE}}
  AWS_REGION: us-east-1
  EKS_CLUSTER: vprofile-eks

jobs:
    terraform:
      name: "aplly terraform code changes"
      runs-out: ubuntu-latest
      defaults: 
        run: 
            shell: bash 
            working-directory: ./terraform
      steps:
        - name: checkout source code
          uses: actions/checkout@v4

        - name: setup terraformwith specified version on the runner
          uses: hashicorp/setup-terraform@v4
        
        - name: terraform init
          id: init
          run: terraform init -backend-config="bucket=$BUCKET_TF_STATE"

        - name: terraform format
          id: fmt
          run: terraform fmt -check

        - name: terraform validate
          id: validate
          run: terraform validate

        - name: terraform plan
          id: plan
          run: terraform plan -no-color -input=false -out planfile
          continue-on-error: true

        - name: terraform plan status
          if: steps.plan.outcome == 'false'
          run: exit 1
